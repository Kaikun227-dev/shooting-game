  const dy = finalTarget.y - player.y;
  const dist = Math.hypot(dx, dy);
  const vx = (dist > 0) ? (dx / dist) * 15 : 0; // 高速
  const vy = (dist > 0) ? (dy / dist) * 15 : 0;
  
  const lv = getFragileShotLevel();
  const fragileLv = lv >= 2 ? 2 : 1;
  
  playerFragileShots.push({
    x: player.x, y: player.y,
    vx, vy, trail: [],
    dmg: 1,
    fragileLv: fragileLv,
    fragileDuration: 600, // 10秒
    alive: true,
    hitSet: new Set(),
  });
  
  player.fragileshotCooldown = 1440; // 24秒クールタイム
}

function updatePlayerFragileShots() {
  const allTargets = [...enemies];
  if (boss && boss.alive) allTargets.push(boss);
  if (bossManager && bossManager.alive) {
    if (bossManager.boss && bossManager.boss.alive) allTargets.push(bossManager.boss);
    for (const e of (bossManager.enemies||[])) if (e.alive) allTargets.push(e);
    for (const m of (bossManager.minions||[])) if (m.alive) allTargets.push(m);
  }

  for (const fs of playerFragileShots) {
    if (!fs.alive) continue;
    
    fs.x += fs.vx;
    fs.y += fs.vy;

    // 残像
    fs.trail.unshift({ x: fs.x, y: fs.y, alpha: 0.4 });
    if (fs.trail.length > 5) fs.trail.pop();

    // 画面外判定
    if (fs.x < -20 || fs.x > W + 20 || fs.y < -20 || fs.y > H + 20) {
      fs.alive = false;
      continue;
    }

    // 敵への当たり判定
    for (const e of allTargets) {
      if (!e.alive) continue;
      if (fs.hitSet.has(e)) continue;
      const size = e.size || 30;
      if (Math.hypot(e.x - fs.x, e.y - fs.y) < 10 + size) {
        if (e.hit) { e.hit(fs.dmg); spawnDamagePopup(e.x, e.y-10, fs.dmg, false); }
        else damageEnemy(e, fs.dmg);
        
        // 脆弱付与
        applyFragile(e, fs.fragileLv, fs.fragileDuration);
        
        fs.hitSet.add(e);
        fs.alive = false;
        break;
      }
    }
  }

  playerFragileShots = playerFragileShots.filter(fs => fs.alive);
}

function drawPlayerFragileShots() {
  for (const fs of playerFragileShots) {
    // 残像
    for (const tr of fs.trail) {
      ctx.save();
      ctx.globalAlpha = tr.alpha * 0.5;
      ctx.fillStyle = '#0088ff';
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    
    // 本体（群青色）
    ctx.save();
    ctx.fillStyle = '#0066ff';
    ctx.shadowColor = '#0044ff';
    ctx.shadowBlur = 12;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.arc(fs.x, fs.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function firePlayerMeteor(lv) {
  const allTargets = [...enemies];
  if (boss && boss.alive) allTargets.push(boss);
  if (allTargets.length === 0) return;

  const size = lv === 1 ? 30 : (lv === 2 ? 42 : (lv === 3 ? 54 : 68));
  const dmg = player.damage + (lv >= 4 ? 50 : 30);

  // ランダムな敵を1体選ぶ
  const target = allTargets[Math.floor(Math.random() * allTargets.length)];
  spawnMeteor(target, size, dmg, false, lv);

  // lv4: 小メテオ2つを別の敵に向けて追加発射
  if (lv >= 4) {
    const others = allTargets.filter(e => e !== target);
    const smDmg = player.damage + 25;
    for (let i = 0; i < 2; i++) {
      const smTarget = others.length > 0
        ? others[Math.floor(Math.random() * others.length)]
        : allTargets[Math.floor(Math.random() * allTargets.length)];
      spawnMeteor(smTarget, size * 0.6, smDmg, true, lv);
    }
  }
}

function spawnMeteor(target, size, dmg, isMini, lv) {
  // 画面外から出現（ランダムな辺）
  const side = Math.floor(Math.random() * 4);
  let sx, sy;
  if (side === 0) { sx = Math.random() * W; sy = -size * 2; }
  else if (side === 1) { sx = Math.random() * W; sy = H + size * 2; }
  else if (side === 2) { sx = -size * 2; sy = Math.random() * H; }
  else { sx = W + size * 2; sy = Math.random() * H; }

  const dx = target.x - sx, dy = target.y - sy;
  const len = Math.hypot(dx, dy) || 1;
  const speed = 8;

  playerMeteors.push({
    x: sx, y: sy,
    vx: (dx / len) * speed, vy: (dy / len) * speed,
    angle: Math.atan2(dy, dx),
    size, dmg, isMini, lv,
    trail: [], jetTimer: 0,
    alive: true, hit: false,
    target,
  });
}

function updatePlayerMeteors() {
  for (const m of playerMeteors) {
    if (!m.alive) continue;
    m.x += m.vx; m.y += m.vy;

    // 残像
    m.trail.unshift({ x: m.x, y: m.y, alpha: 0.4 });
    if (m.trail.length > 9) m.trail.pop();

    // 噴射弾（メテオのみ、毎4f）
    if (!m.isMini && m.jetTimer++ % 5 === 0) {
      const backAngle = m.angle + Math.PI;
      for (let i = 0; i < 3; i++) {
        const spread = (Math.random() - 0.5) * 0.5;
        const jspeed = 1.5 + Math.random() * 5;
        const jdmg = Math.max(1, Math.floor(player.damage));
        playerBullets.push({
          x: m.x, y: m.y,
          vx: Math.cos(backAngle + spread) * jspeed,
          vy: Math.sin(backAngle + spread) * jspeed,
          alive: true, dmg: jdmg,
          color: '#ffaa44', glow: '#ff6600',
          pierce: false, pierced: false, infinitePierce: false,
          isItem: true,
        });
      }
    }

    // 当たり判定（貫通: 0.4秒クールダウンで複数体にダメージ）
    if (!m.hitSet) m.hitSet = new Set();
    const allTargets = [...enemies];
    if (boss && boss.alive) allTargets.push(boss);
    for (const e of allTargets) {
      if (!e.alive) continue;
      if (m.hitSet.has(e)) continue;
      if (Math.hypot(e.x - m.x, e.y - m.y) < (e.size || 30) + m.size) {
        if (e.hit) { e.hit(m.dmg); spawnDamagePopup(e.x, e.y-10, m.dmg, false); } else damageEnemy(e, m.dmg);
        m.hitSet.add(e);
        setTimeout(() => m.hitSet && m.hitSet.delete(e), 400);
      }
    }

    // 画面外で消滅
    if (m.x < -200 || m.x > W + 200 || m.y < -200 || m.y > H + 200) m.alive = false;
  }
  playerMeteors = playerMeteors.filter(m => m.alive);
}

function drawPlayerMeteors() {
  for (const m of playerMeteors) {
    // 残像
    for (const tr of m.trail) {
      ctx.save();
      ctx.globalAlpha = tr.alpha * 0.5;
      ctx.fillStyle = '#ffaa44';
      drawMeteorShape(ctx, tr.x, tr.y, m.size * 0.8, m.angle);
      ctx.restore();
    }
    // 本体
    ctx.save();
    ctx.fillStyle = m.isMini ? '#ffcc88' : '#ffaa44';
    ctx.shadowColor = '#ff8800';
    ctx.shadowBlur = 14;
    drawMeteorShape(ctx, m.x, m.y, m.size, m.angle);
    ctx.restore();
  }
}

function drawMeteorShape(ctx, x, y, r, angle) {
  // ギザギザの丸（放射状のスパイク付き円）
  const spikes = 12;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const a = (Math.PI * 2 / (spikes * 2)) * i;
    const rad = i % 2 === 0 ? r : r * 0.65;
    if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
    else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ==================== HELPER UNIT ====================
function spawnHelperUnit(lv) {
  // 既存ユニットのlvだけ更新する（常に1体のみ）
  if (helperUnits.length > 0) { helperUnits[0].lv = lv; helperUnits[0].attackInterval = lv >= 4 ? 55 : 90; return; }
  // 初期位置: 自機の少し上
  const startX = player.x;
  const startY = player.y - 60;
  helperUnits.push({
    x: startX, y: startY, lv,
    // star/boss10型ステートマシン
    state: 'move',
    stateTimer: 0,
    tx: 60 + Math.random() * (W - 120),
    ty: 40 + Math.random() * (H / 2 - 40),
    // 攻撃
    attackTimer: 0,
    attackInterval: lv >= 4 ? 55 : 90,
    rampageActive: false, rampageTimer: 0, rampageStep: 0,
    lasers: [],
    alive: true,
  });
}

function updateHelperUnits() {
  const allTargets = [...enemies];
  if (boss && boss.alive) allTargets.push(boss);

  for (const h of helperUnits) {
    if (!h.alive) continue;

    // --- star敵型の素早い挙動不審移動 ---
    h.stateTimer++;
    if (!h.rampageActive) {
      if (h.state === 'move') {
        h.x += (h.tx - h.x) * 0.045;
        h.y += (h.ty - h.y) * 0.045;
        if (h.stateTimer > 40 + Math.random() * 30) {
          h.state = Math.random() < 0.45 ? 'stop' : 'dash';
          h.stateTimer = 0;
        }
      } else if (h.state === 'stop') {
        // 止まって次の目標を設定
        if (h.stateTimer > 15 + Math.random() * 20) {
          h.tx = 60 + Math.random() * (W - 120);
          h.ty = 40 + Math.random() * (H / 2 - 40);
          h.state = 'move'; h.stateTimer = 0;
        }
      } else if (h.state === 'dash') {
        // 高速突進
        h.x += (h.tx - h.x) * 0.18;
        h.y += (h.ty - h.y) * 0.18;
        if (h.stateTimer > 18) {
          h.tx = 60 + Math.random() * (W - 120);
          h.ty = 40 + Math.random() * (H / 2 - 40);
          h.state = 'move'; h.stateTimer = 0;
        }
      }
      h.x = Math.max(30, Math.min(W - 30, h.x));
      h.y = Math.max(30, Math.min(H - 30, h.y));
    }

    // --- レーザー更新 ---
    for (const l of h.lasers) {
      l.timer++;
      if (l.timer >= l.warningTime && l.timer < l.activeTime) {
        if (player.alive && !player.invincible) { /* ヘルパーレーザーは自機には当たらない */ }
        // 敵に当たる
        for (const e of allTargets) {
          if (!e.alive || (l.hitSet && l.hitSet.has(e))) continue;
          const vx = Math.cos(l.angle), vy = Math.sin(l.angle);
          const dx = e.x - l.x, dy = e.y - l.y;
          const t2 = dx*vx + dy*vy;
          if (t2 > 0 && t2 < l.length) {
            const dist = Math.hypot(e.x - (l.x + t2*vx), e.y - (l.y + t2*vy));
            if (dist < (e.size || 30)) {
              if (!l.hitSet) l.hitSet = new Set();
              if (e.hit) { e.hit(l.dmg); spawnDamagePopup(e.x, e.y-10, l.dmg, false); } else damageEnemy(e, l.dmg);
              l.hitSet.add(e);
            }
          }
        }
      }
      if (l.timer >= l.activeTime) l.alive = false;
    }
    h.lasers = h.lasers.filter(l => l.alive);

    // --- ランページレーザー進行 ---
    if (h.rampageActive) {
      h.rampageTimer++;
      if (h.rampageStep < 8 && h.rampageTimer % 6 === 0) {
        const angle = (Math.PI * 2 / 8) * h.rampageStep + Math.random() * 0.5;
        const dmg = player.damage + 20;
        h.lasers.push({ x: h.x, y: h.y, angle, length: Math.max(W,H)*2, timer: 0, warningTime: 10, activeTime: 28, alive: true, dmg, hitSet: new Set() });
        h.rampageStep++;
      }
      if (h.rampageStep >= 8 && h.lasers.length === 0) {
        h.rampageActive = false; h.rampageTimer = 0; h.rampageStep = 0;
      }
      continue; // ランページ中は通常攻撃しない
    }

    // --- 攻撃 ---
    h.attackTimer++;
    if (h.attackTimer < h.attackInterval) continue;
    if (allTargets.filter(e => e.alive).length === 0) continue;
    h.attackTimer = 0;

    // 一番近い敵を探す
    let nearestEnemy = null, nearestDist = Infinity;
    for (const e of allTargets) {
      if (!e.alive) continue;
      const d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < nearestDist) { nearestDist = d; nearestEnemy = e; }
    }

    // lv別攻撃ローテーション
    const possibleAttacks = ['fan3'];
    if (h.lv >= 2) possibleAttacks.push('omni16');
    if (h.lv >= 3) possibleAttacks.push('burst12');
    if (h.lv >= 4) possibleAttacks.push('rampage');

    // fan3を多めに選ぶ（確率調整）
    let attack;
    const r = Math.random();
    if (r < 0.5 || possibleAttacks.length === 1) {
      attack = 'fan3';
    } else {
      attack = possibleAttacks[1 + Math.floor(Math.random() * (possibleAttacks.length - 1))];
    }

    if (attack === 'fan3' && nearestEnemy) {
      // 狭い扇形三方向弾
      const baseAngle = Math.atan2(nearestEnemy.y - h.y, nearestEnemy.x - h.x);
      const dmg = player.damage + 3;
      const bspeed = 12;
      for (let i = -1; i <= 1; i++) {
        const a = baseAngle + i * 0.2;
        playerBullets.push({ x: h.x, y: h.y, vx: Math.cos(a)*bspeed, vy: Math.sin(a)*bspeed, alive: true, dmg, color: '#aaff44', glow: '#44ff44', pierce: false, pierced: false, infinitePierce: false, isItem: true });
      }
    } else if (attack === 'omni16') {
      // 16方向弾
      const dmg = player.damage + 5;
      for (let i = 0; i < 16; i++) {
        const a = (Math.PI * 2 / 16) * i;
        playerBullets.push({ x: h.x, y: h.y, vx: Math.cos(a)*5, vy: Math.sin(a)*5, alive: true, dmg, color: '#aaff44', glow: '#44ff44', pierce: false, pierced: false, infinitePierce: false, isItem: true });
      }
    } else if (attack === 'burst12' && nearestEnemy) {
      // 連続12発射
      const baseAngle = Math.atan2(nearestEnemy.y - h.y, nearestEnemy.x - h.x);
      const dmg = player.damage;
      for (let i = 0; i < 12; i++) {
        const delay = i * 60;
        setTimeout(() => {
          if (!h.alive) return;
          const a = baseAngle + (Math.random() - 0.5) * 0.15;
          playerBullets.push({ x: h.x, y: h.y, vx: Math.cos(a)*8, vy: Math.sin(a)*8, alive: true, dmg, color: '#aaff44', glow: '#44ff44', pierce: false, pierced: false, infinitePierce: false, isItem: true });
        }, delay);
      }
    } else if (attack === 'rampage') {
      // ランページレーザー（一時停止して32方向から8本）
      h.rampageActive = true; h.rampageTimer = 0; h.rampageStep = 0;
    }
  }
}

function drawHelperUnits() {
  for (const h of helperUnits) {
    if (!h.alive) continue;
    // レーザー描画
    for (const l of h.lasers) {
      ctx.save();
      if (l.timer < l.warningTime) {
        const wp = l.timer / l.warningTime;
        ctx.globalAlpha = 0.1 + 0.55 * wp;
        ctx.strokeStyle = '#aaff44'; ctx.lineWidth = 1;
        ctx.setLineDash([]); ctx.lineCap = 'round';
        ctx.shadowColor = '#44ff44'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x + Math.cos(l.angle)*l.length, l.y + Math.sin(l.angle)*l.length);
        ctx.stroke();
      } else {
        const prog = (l.timer - l.warningTime) / (l.activeTime - l.warningTime);
        ctx.globalAlpha = 0.9 * (1 - prog * 0.5);
        ctx.strokeStyle = '#ccff66'; ctx.lineWidth = Math.max(1, 10*(1-prog));
        ctx.shadowColor = '#aaff44'; ctx.shadowBlur = 18; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x + Math.cos(l.angle)*l.length, l.y + Math.sin(l.angle)*l.length);
        ctx.stroke();
      }
      ctx.restore();
    }
    // ユニット本体（黄色+緑縁の丸）
    ctx.save();
    const pulse = 0.85 + 0.15 * Math.sin(Date.now() * 0.004);
    const r = 14 * pulse;
    // 外側（緑）
    ctx.beginPath(); ctx.arc(h.x, h.y, r + 4, 0, Math.PI*2);
    ctx.fillStyle = '#44cc22'; ctx.shadowColor = '#44ff44'; ctx.shadowBlur = 12; ctx.fill();
    // 内側（黄色）
    ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI*2);
    ctx.fillStyle = '#ffee44'; ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 8; ctx.fill();
    // ランページ中は白く点滅
    if (h.rampageActive && Math.floor(Date.now() / 100) % 2 === 0) {
      ctx.beginPath(); ctx.arc(h.x, h.y, r + 6, 0, Math.PI*2);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ==================== FIRE ====================
let fireParticles = [];

function firePlayerFire(lv) {
  const fireLv = lv;
  const maxDist = fireLv===1?150 : fireLv===2?200 : fireLv===3?250 : 300;
  const baseDmg = curseSlots.includes('炎') ? 2 : 1;
  const a = Math.atan2(player.y - (player.y+1), 0); // 上向き基準
  // 自機の前方向（最近くの敵へ）
  let targetAngle = -Math.PI/2;
  const allE = [...enemies]; if (boss&&boss.alive) allE.push(boss);
  let nearDist = Infinity, nearE = null;
  for (const e of allE) { if(!e.alive)continue; const d=Math.hypot(e.x-player.x,e.y-player.y); if(d<nearDist){nearDist=d;nearE=e;} }
  if (nearE) targetAngle = Math.atan2(nearE.y-player.y, nearE.x-player.x);

  // 扇状に3本の炎パーティクルを発射
  for (let i=-1; i<=1; i++) {
    const spread = i * 0.22;
    const ang = targetAngle + spread;
    const speed = 6 + Math.random()*1.5;
    fireParticles.push({
      x: player.x, y: player.y,
      vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed,
      life: Math.floor(maxDist / speed), maxLife: Math.floor(maxDist/speed),
      size: 5 + fireLv*1.5,
      dmg: baseDmg, lv: fireLv,
      hitSet: new Set(), alive: true,
      color: ['#ffaa44','#ff6600','#ff3300'][i+1],
      isEnhanced: curseSlots.includes('炎'),
    });
  }
}

function updateFireParticles() {
  const allE = [...enemies]; if (boss&&boss.alive) allE.push(boss);
  for (const fp of fireParticles) {
    if (!fp.alive) continue;
    fp.x += fp.vx; fp.y += fp.vy;
    fp.life--;
    if (fp.life <= 0) { fp.alive = false; continue; }
    for (const e of allE) {
      if (!e.alive || fp.hitSet.has(e)) continue;
      if (Math.hypot(fp.x-e.x, fp.y-e.y) < (e.size||20)+fp.size) {
        // 初回ヒット: 5*lv追加ダメージ
        const firstHit = !e.fireHitSet;
        if (!e.fireHitSet) e.fireHitSet = new Set();
        const isFirst = !e.fireHitSet.has('fired');
        const extraDmg = isFirst ? 5*fp.lv : 0;
        if (isFirst) e.fireHitSet.add('fired');
        const totalDmg = fp.dmg + extraDmg;
        if (e.hit) { e.hit(totalDmg); spawnDamagePopup(e.x, e.y-10, totalDmg, false); }
        else { damageEnemy(e, totalDmg); }
        // 脆弱ダメージ追加
        const fragExtra = applyFragileDamage(e, totalDmg);
        if (fragExtra>0) { if(e.hit)e.hit(fragExtra); else damageEnemy(e,fragExtra); }
        fp.hitSet.add(e);
        setTimeout(()=>fp.hitSet.delete(e), 100);
      }
    }
  }
  fireParticles = fireParticles.filter(fp => fp.alive);
}

function drawFireParticles() {
  for (const fp of fireParticles) {
    const alpha = (fp.life / fp.maxLife) * 0.85;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = fp.color; ctx.shadowColor = fp.color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(fp.x, fp.y, fp.size*(fp.life/fp.maxLife)+2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function resetFireParticles() { fireParticles = []; }

function firePlayerChakram(lv) {
  const target = findNearestEnemy();
  if (!target) return;
  const angle = Math.atan2(target.y - player.y, target.x - player.x);
  const size = 8 + lv * 4;
  const dmg = player.damage + lv * 5;
  playerChakrams.push({
    x: player.x,
    y: player.y,
    vx: Math.cos(angle) * 10,
    vy: Math.sin(angle) * 10,
    size,
    dmg,
    reflectRemaining: lv === 4 ? 2 : 1,
    alive: true,
    hitSet: new Set(),
    trail: []
  });
}

function firePlayerBubble(lv) {
  const target = findNearestEnemy();
  if (!target) return;
  const angle = Math.atan2(target.y - player.y, target.x - player.x);
  const speed = 8;
  const dmg = player.damage + 10;
  playerBubbles.push({
    x: player.x,
    y: player.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    radius: 80,
    minRadius: 20,
    timer: 0,
    alive: true,
    hitSet: new Set(),
    dmg,
    reflectRemaining: lv,
    trail: []
  });
}

function updateEnemyBullets() {
  for (const b of enemyBullets) {
    if (!b.alive) continue;
    if (playerBubbles.length > 0) {
      for (const sb of playerBubbles) {
        if (!sb.alive || !sb.blockBullets) continue;
        if (Math.hypot(b.x - sb.x, b.y - sb.y) < sb.radius + 4) { b.alive = false; break; }
      }
      if (!b.alive) continue;
    }
    if (b.splitTimer !== undefined) {
      b.splitTimer--;
      if (b.splitTimer <= 0 && !b.hasSplit) {
        b.hasSplit = true;
        for (let i = 0; i < 6; i++) enemyBullets.push({ x: b.x, y: b.y, vx: Math.cos(i*Math.PI/3)*4, vy: Math.sin(i*Math.PI/3)*4, alive: true });
        b.alive = false; continue;
      }
    }
    if (b.reflectable && !b.reflected) {
      if (b.x <= 0 || b.x >= W) { b.vx *= -1; b.reflected = true; }
      if (b.y <= 0 || b.y >= H) { b.vy *= -1; b.reflected = true; }
    }
    if (b.reflectableWalls) {
      if ((b.x <= 0 || b.x >= W) && b.reflectCount < 2) { b.vx *= -1; b.reflectCount++; }
      if ((b.y <= 0 || b.y >= H) && b.reflectCount < 2) { b.vy *= -1; b.reflectCount++; }
    }
    b.x += b.vx; b.y += b.vy;
    
    // Handle rampage bombs: expand to 16 directions after timer
    if (b.type === 'rampageBomb') {
      b.timer--;
      if (b.timer <= 0 && b.expandTimer === 0) {
        b.expandTimer = 1;
        for (let i = 0; i < 16; i++) {
          const angle = (i / 16) * Math.PI * 2;
          enemyBullets.push({x: b.x, y: b.y, vx: Math.cos(angle)*5, vy: Math.sin(angle)*5, alive: true, type: 'normalBullet', size: 6, color: '#ff6699'});
        }
        b.alive = false; continue;
      }
    }
    
    // Handle reflectable chakrams from enemies
    if (b.type === 'enemyChakram') {
      if (b.trail === undefined) b.trail = [];
      b.trail.unshift({x: b.x, y: b.y, alpha: 0.4});
      if (b.trail.length > 12) b.trail.pop();
      if (b.reflectCount < b.maxReflect) {
        if (b.x <= 0 || b.x >= W) { b.vx *= -1; b.reflectCount++; }
        if (b.y <= 0 || b.y >= H) { b.vy *= -1; b.reflectCount++; }
      }
    }
    
    if (b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) b.alive = false;
    if (player.alive && !player.invincible && Math.hypot(player.x - b.x, player.y - b.y) < 16) { hitPlayer(b.dmg || 15); b.alive = false; }
  }
  enemyBullets = enemyBullets.filter(b => b.alive);

  for(const l of enemyLasers) {
    if(l.warningTimer > 0) l.warningTimer--;
    else if(l.activeTimer > 0) {
      l.activeTimer--;
      if(player.alive && !player.invincible && player.damageTimer === 0) {
        let hit = false;
        if(l.axis === 'custom') {
          const dx = Math.cos(l.angle), dy = Math.sin(l.angle);
          const px = player.x - l.x, py = player.y - l.y;
          hit = Math.abs(px*dy - py*dx) < 14;
        } else hit = l.axis === 'h' ? Math.abs(player.y - l.pos) < 14 : Math.abs(player.x - l.pos) < 14;
        if(hit) hitPlayerDamage(2, 20);
      }
    } else l.done = true;
  }
  enemyLasers = enemyLasers.filter(l => !l.done);
  
  // Plasmas update (2.4s = 144 frames)
  for (const p of plasmas) {
    if (p.timer < 144) {
      p.timer++;
      if (p.timer === 144) {
        p.lightningTimer = 15;
        if (!p.isPlayer) {
          if (player.alive && !player.invincible && Math.hypot(player.x - p.x, player.y - p.y) <= p.maxR) hitPlayerDamage(2, 30);
        } else {
          const allE = [...enemies];
          if(boss && boss.alive) allE.push(boss);
          if(bossManager && bossManager.alive) {
            if(bossManager.boss && bossManager.boss.alive) allE.push(bossManager.boss);
            for(const e of (bossManager.enemies||[])) if(e.alive) allE.push(e);
            for(const m of (bossManager.minions||[])) if(m.alive) allE.push(m);
          }
          for (const e of allE) {
            if (Math.hypot(e.x - p.x, e.y - p.y) <= p.maxR) {
              if(e.hit) { e.hit(p.dmg); spawnDamagePopup(e.x, e.y-10, p.dmg, false); } else damageEnemy(e, p.dmg);
            }
          }
        }
      }
    } else if (p.lightningTimer > 0) {
      p.lightningTimer--;
      if (p.lightningTimer <= 0) {
        p.done = true;
      }
    }
  }
  plasmas = plasmas.filter(p => !p.done);
}

function drawEnemyBullets() {
  for (const b of enemyBullets) {
    ctx.save();
    if (b.type === 'enemyChakram' || b.type === 'bossChakram') {
      for (const t of b.trail || []) {
        ctx.globalAlpha = t.alpha;
        ctx.fillStyle = '#ff6699';
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.size, 0, Math.PI*2);
        ctx.arc(t.x, t.y, b.size * 0.5, 0, Math.PI*2, true);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ff6699'; ctx.shadowColor = '#ff6699'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, Math.PI*2);
      ctx.arc(b.x, b.y, b.size * 0.5, 0, Math.PI*2, true);
      ctx.fill();
    } else if (b.type === 'rampageBomb') {
      ctx.fillStyle = '#ff6699'; ctx.shadowColor = '#ff6699'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#ffaaaa'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size*1.5, 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.fillStyle = b.color || '#f22'; ctx.shadowColor = b.glow || '#f00'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  for (const l of enemyLasers) {
    ctx.save();
    if(l.axis==='custom') {
      const len = 1500, x2 = l.x + Math.cos(l.angle)*len, y2 = l.y + Math.sin(l.angle)*len;
      const x1 = l.x - Math.cos(l.angle)*len, y1 = l.y - Math.sin(l.angle)*len;
      if(l.warningTimer > 0) {
        const wp = 1 - l.warningTimer / (l.warningTimer + 1);
        ctx.globalAlpha = 0.15 + 0.5*(l.warningTimer <= 20 ? 1 : 0.4);
        ctx.strokeStyle='#ff9999'; ctx.lineWidth=1; ctx.shadowColor='#ff4444'; ctx.shadowBlur=6; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      }
      else if(l.activeTimer > 0) { ctx.globalAlpha=0.9; ctx.shadowColor='#f55'; ctx.shadowBlur=20; ctx.strokeStyle='#ff8888'; ctx.lineWidth=8; ctx.setLineDash([]); }
      if(l.activeTimer > 0) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
    } else {
      if(l.warningTimer > 0) {
        ctx.globalAlpha = 0.15 + (l.warningTimer <= 20 ? 0.5 : 0.25);
        ctx.strokeStyle='#ff9999'; ctx.lineWidth=1; ctx.shadowColor='#ff4444'; ctx.shadowBlur=6; ctx.setLineDash([]);
        ctx.beginPath(); l.axis==='h'?ctx.moveTo(0,l.pos):ctx.moveTo(l.pos,0); l.axis==='h'?ctx.lineTo(W,l.pos):ctx.lineTo(l.pos,H); ctx.stroke();
      }
      else if(l.activeTimer > 0) { ctx.globalAlpha=0.9; ctx.shadowColor='#f55'; ctx.shadowBlur=20; ctx.strokeStyle='#ff8888'; ctx.lineWidth=8; ctx.setLineDash([]); ctx.beginPath(); l.axis==='h'?ctx.moveTo(0,l.pos):ctx.moveTo(l.pos,0); l.axis==='h'?ctx.lineTo(W,l.pos):ctx.lineTo(l.pos,H); ctx.stroke(); }
    }
    ctx.restore();
  }
  for (const p of plasmas) {
    ctx.save();
    // ringColor があれば優先（ボス14オレンジプラズマ等）
    const ringC = p.ringColor || (p.isPlayer ? '#ff0' : '#f0f');
    if (p.timer < 144) {
      ctx.strokeStyle = ringC; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.maxR, 0, Math.PI*2); ctx.stroke();
      if (p.ringColor) {
        ctx.globalAlpha = 0.15; ctx.fillStyle = p.ringColor;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.maxR * (p.timer/144), 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = p.isPlayer ? 'rgba(255,255,0,0.2)' : 'rgba(255,0,255,0.2)';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.maxR * (p.timer/144), 0, Math.PI*2); ctx.fill();
      }
    } else if (p.lightningTimer > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.maxR, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = p.isPlayer ? '#ff0' : '#eef'; ctx.lineWidth = 3; ctx.shadowColor = p.isPlayer ? '#ff0' : '#0ff'; ctx.shadowBlur = 10;
      for(let i=0; i<5; i++) {
        ctx.beginPath(); ctx.moveTo(p.x + (Math.random()-0.5)*p.maxR, p.y + (Math.random()-0.5)*p.maxR);
        for(let j=0; j<3; j++) ctx.lineTo(p.x + (Math.random()-0.5)*p.maxR*1.5, p.y + (Math.random()-0.5)*p.maxR*1.5); ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function fireEnemy(ex, ey, angle, speed, opts={}) {
  const vx = Math.cos(angle)*speed, vy = Math.sin(angle)*speed;
  enemyBullets.push({ x: ex, y: ey, vx, vy, alive: true, ...opts });
}

let resonanceTimer = 0;
let resonanceEffectTimer = 0;

function createTriEnemy(x) {

    update() { this.y += this.vy; this.fireTimer++; if (this.fireTimer >= 100) { this.fireTimer = 0; for(let i=-1;i<=1;i++) fireEnemy(this.x,this.y,Math.PI/2+i*0.35,3); } if (this.y > H+30) fadeOut(this); },
    draw() { ctx.save(); ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 8; ctx.beginPath(); ctx.moveTo(this.x, this.y+this.size); ctx.lineTo(this.x-this.size, this.y-this.size*0.8); ctx.lineTo(this.x+this.size, this.y-this.size*0.8); ctx.closePath(); ctx.fill(); ctx.restore(); drawEnemyHp(this); }

function createDiamondEnemy(x) {

    update() { this.x+=this.vx; this.y+=this.vy; if ((this.x<=0||this.x>=W)&&this.reflectCount<2) { this.vx*=-1; this.reflectCount++; } this.x=Math.max(0,Math.min(W,this.x)); this.fireTimer++;
      if (this.fireTimer>=80) { this.fireTimer=0; for(let a of [0,Math.PI/2,Math.PI,Math.PI*3/2]) { fireEnemy(this.x,this.y,a,3.5); fireEnemy(this.x,this.y,a,5.0); } } if (this.y>H+30||(this.reflectCount>=2&&(this.x<0||this.x>W))) fadeOut(this); },

function createSideTriEnemy() {

function fadeOut(e) { e.alive = false; }
function loopHP(baseHp) { const base = (loopCount <= 1) ? baseHp : (loopCount === 2) ? baseHp*2 : (loopCount === 3) ? baseHp*4 : (loopCount === 4) ? baseHp*6 : baseHp*(loopCount*2); return Math.round(base * simEnemyHpMult); }
function drawEnemyHp(e) { if(e.hp===e.maxHp)return; const bw=e.size*2+4,bx=e.x-bw/2,by=e.y-e.size-12; ctx.fillStyle='#333'; ctx.fillRect(bx,by,bw,5); ctx.fillStyle='#f44'; ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),5); }

function createDropletEnemy() {
  return { 
    type: 'droplet', x: 50+Math.random()*(W-100), y: -30, vx: 0, vy: 0, 
    hp: 9999, maxHp: 9999, alive: true, size: 24, color: '#e60073', 
    marked: false, markedDamageCount: 0,
    state: 'approach', stateTimer: 0, chargeTimer: 0, 
    dashVx: 0, dashVy: 0, dashTrail: [], charging: false, pDamTimer: 0,
    
    update() {
      if(this.state==='approach') { 
        this.y += 1.2; 
        this.stateTimer++; 
        if(this.stateTimer >= 100) { 
          this.state = 'dash_loop'; 
          this.chargeTimer = 0; 
          this.charging = false; 
        } 
      }
      else if(this.state==='dash_loop') {
        if(!this.charging) { 
          // 突進準備（停止時間）
          this.chargeTimer++; 
          // 準備時間を80から100に少し増やして、次の突進へのタメを作ります
          if(this.chargeTimer >= 100) { 
            this.charging = true; 
            this.chargeTimer = 0; 
            const dx = player.x - this.x, dy = player.y - this.y;
            const d = Math.hypot(dx, dy) || 1; 
            // 突進速度。8から10に上げてより「暴走」感を出しつつ
            this.dashVx = dx / d * 10; 
            this.dashVy = dy / d * 10; 
          } 
        }
        else {
          // 突進中
          this.dashTrail.push({x: this.x, y: this.y, life: 10});
          this.x += this.dashVx; 
          this.y += this.dashVy;

          // 壁判定
          let hitWall = false;
          if (this.x < 20 || this.x > W - 20) {
            this.dashVx *= -1; // X方向に反射
            this.x += this.dashVx * 0.3; // 反射して0.3倍分戻る
            hitWall = true;
          }
          if (this.y < 20 || this.y > H - 20) {
            this.dashVy *= -1; // Y方向に反射
            this.y += this.dashVy * 0.3; // 反射して0.3倍分戻る
            hitWall = true;
          }

          // 壁に当たったら突進終了、待機状態へ
          if (hitWall) {
            this.charging = false;
            this.chargeTimer = 0;
            this.dashVx = 0;
            this.dashVy = 0;
          }
        }
      }
      for(const t of this.dashTrail) t.life--; 
      this.dashTrail = this.dashTrail.filter(t => t.life > 0);
    },

    draw() { 
      for(const t of this.dashTrail){ 
        ctx.save(); ctx.globalAlpha = t.life/10*0.5; ctx.fillStyle = this.color; 
        ctx.beginPath(); ctx.arc(t.x, t.y, this.size, 0, Math.PI*2); ctx.fill(); ctx.restore(); 
      }
      ctx.save(); ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 8; 
      ctx.translate(this.x, this.y); 
      
      ctx.beginPath(); 
      const s = this.size * 0.8;
      ctx.moveTo(0, -s * 0.3); 
      ctx.bezierCurveTo(s * 1.2, -s * 1.5, s * 2.0, s * 0.5, 0, s * 1.5); 
      ctx.bezierCurveTo(-s * 2.0, s * 0.5, -s * 1.2, -s * 1.5, 0, -s * 0.3); 
      ctx.closePath(); 
      ctx.fill(); ctx.restore(); drawEnemyHp(this); 
    }
  };
}

function spawnEnemy() {
  const plusHealCount = curseSlots.includes('治') ? 3 : 1; // 治呪字で出現率UP
  const table = [ ...Array(20).fill('square'), ...Array(20).fill('tri'), ...Array(15).fill('rect'), ...Array(12).fill('sideTri'), ...Array(10).fill('diamond'), ...Array(5).fill('plus'), ...Array(5).fill('circle'), ...Array(5).fill('arrow'), ...Array(3).fill('hex'), ...Array(3).fill('pentagon'), ...Array(3).fill('octagon'), ...Array(3).fill('star'), ...Array(plusHealCount).fill('plusheal') ];
  
  let t;
  if (currentEvent === 'swarm' && eventEnemyType) {
    // 大量発生イベント中は選ばれた敵のみ出現
    t = eventEnemyType;
  } else {
    t = table[Math.floor(Math.random()*table.length)];
  }
  
  const x = 40 + Math.random()*(W-80); let e;
  switch(t) { case 'tri': e=createTriEnemy(x); break; case 'diamond': e=createDiamondEnemy(x); break; case 'square': e=createSquareEnemy(x); break; case 'hex': e=createHexEnemy(x); break; case 'sideTri': e=createSideTriEnemy(); break; case 'rect': e=createRectEnemy(x); break; case 'circle': e=createCircleEnemy(x); break; case 'star': e=createStarEnemy(); break; case 'plus': e=createPlusEnemy(); break; case 'pentagon': e=createPentagonEnemy(); break; case 'octagon': e=createOctagonEnemy(); break; case 'arrow': e=createArrowEnemy(); break; case 'plusheal': e=createPlusHealEnemy(); break; }
  if (e) enemies.push(e);
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue; e.update();
    
    // 突進中の敵のみ接触ダメージ（通常の体当たりダメージは無し）
    if (e.charging && player.alive && !player.invincible && player.damageTimer === 0) {
      const hitRadius = e.size ? Math.max(20, e.size) : 20;
      if (Math.hypot(player.x - e.x, player.y - e.y) < hitRadius) {
        if (e.type === 'droplet') hitPlayerDamage(2, 30);
        else hitPlayer(30);
      }
    }
    
    for (const b of playerBullets) {
      if (!b.alive || b.isPoisonAura) continue; // isPoisonAura は毒付与のみ・ダメージなし
      if (Math.hypot(e.x - b.x, e.y - b.y) < (e.size||20) + 4) {
        if (b.infinitePierce) {
          if (!b.hitSet.has(e)) {
            damageEnemy(e, b.dmg); b.hitSet.add(e);
            // 染: スナイパー弾命中時に毒付与（マーク共鳴以外）
            if (b.isFromSniper && curseSlots.includes('染')) {
              const snLv = player.items.filter(x=>x==='sniper').length;
              applyPoison(e, snLv||1, 180);
            }
          }
        } 
        else { damageEnemy(e, b.dmg); if (!b.pierce || b.pierced) b.alive = false; else b.pierced = true; }
      }
    }
  }
  
  enemies = enemies.filter(e => e.alive);
  processMarkedEntityResonance();
}

function drawEnemies() { 
  for(const e of enemies) if(e.alive) e.draw();
  for(const e of enemies) if(e.alive && e.marked) drawMarkOnEnemy(e);
  if (resonanceEffectTimer > 0) drawResonance();
}

          this.y = 50 + Math.random()*(H/2);
          this.teleportTimer = 0;
        }
      } else {

      }
      this.fireTimer++;
      const f = this.fireTimer;
      if (this.hp <= this.maxHp * 0.25) {
        if (f % 20 === 0) {

        }
      } else if (this.hp <= this.maxHp * 0.5) {
        if (f % 10 === 0) {
          const a = Math.atan2(player.y-this.y, player.x-this.x);
          fireEnemy(this.x, this.y, a, 4);
        }
      } else if (this.hp <= this.maxHp * 0.75) {
        if (f % 50 === 0) {
          const a = Math.atan2(player.y-this.y, player.x-this.x);
          for (let i=-1; i<=1; i++) fireEnemy(this.x, this.y, a+i*0.26, 3);
        }
      } else {
        if (f % 60 === 0) {
          for (let i=0; i<16; i++) fireEnemy(this.x, this.y, i*Math.PI/8, 2);
        }
      }
    },
    hit(d) { this.hp -= d; if(this.hp<=0){this.hp=0;this.alive=false;} },
    draw() { drawBossCircle(this, this.color, 35); drawBossHpBar(this); }
  };
}

// === BOSS 2: ORANGE ATTACKER ===
function createBoss2() {
  const b = {
    x: W/2, y: 100, hp: loopHP(800), maxHp: loopHP(800), alive: true, color: '#ff9900', // ← colorを追加してHPゲージをオレンジに
    // 挙動不審な移動（boss10/11型）
    state: 'move', stateTimer: 0,
    tx: W/2, ty: 100,
    // 攻撃
    attackTimer: 0, attackInterval: 90,
    rampageLasers: [], rampageStep: 0, rampageActive: false, rampageTimer: 0,

    update() {
      if (!this.alive) return;

      // === 修正ポイント1: ランページ中は移動をスキップ ===
      if (!this.rampageActive) {
        // 挙動不審移動
        this.stateTimer++;
        if (this.state === 'move') {
          this.x += (this.tx - this.x) * 0.04;
          this.y += (this.ty - this.y) * 0.04;
          if (this.stateTimer > 35 + Math.random()*30) {
            this.state = Math.random()<0.4?'stop':'dash'; this.stateTimer=0;
          }
        } else if (this.state === 'stop') {
          if (this.stateTimer > 20) {
            this.tx = 80+Math.random()*(W-160); this.ty = 60+Math.random()*(H/2-60);
            this.state='move'; this.stateTimer=0;
          }
        } else if (this.state === 'dash') {
          this.x += (this.tx-this.x)*0.15; this.y += (this.ty-this.y)*0.15;
          if (this.stateTimer>16){ this.tx=80+Math.random()*(W-160); this.ty=60+Math.random()*(H/2-60); this.state='move'; this.stateTimer=0; }
        }
        this.x=Math.max(40,Math.min(W-40,this.x)); this.y=Math.max(40,Math.min(H/2,this.y));
      }

      // ランページレーザー更新
      for (const l of this.rampageLasers) {
        l.timer++;
        if (l.timer>=l.warningTime && l.timer<l.activeTime) {
          if (player.alive && !player.invincible) {
            // レーザーの起点は発射時のボスの位置に固定されるため this.x, this.y を使用
            const vx=Math.cos(l.angle),vy=Math.sin(l.angle),dx=player.x-l.x,dy=player.y-l.y;
            const t=dx*vx+dy*vy;
            if (t>0&&t<l.length&&Math.hypot(player.x-(l.x+t*vx),player.y-(l.y+t*vy))<12) hitPlayerDamage(2,20);
          }
        }
        if (l.timer>=l.activeTime) l.alive=false;
      }
      this.rampageLasers = this.rampageLasers.filter(l=>l.alive);

      if (this.rampageActive) {
        this.rampageTimer++;
        if (this.rampageStep<16 && this.rampageTimer%4===0) {
          const angle=(Math.PI*2/16)*this.rampageStep+Math.random()*0.2;
          // === 修正ポイント2: warningTimeを10 -> 25に延長、activeTimeも合わせて調整 ===
          this.rampageLasers.push({
            x:this.x, y:this.y, angle, length:Math.max(W,H)*2, 
            timer:0, warningTime:25, activeTime:45, alive:true
          });
          this.rampageStep++;
        }
        if (this.rampageStep>=16&&this.rampageLasers.length===0){this.rampageActive=false;this.rampageTimer=0;this.rampageStep=0;}
        return; 
      }

      // 攻撃
      this.attackTimer++;
      if (this.attackTimer < this.attackInterval) return;
      this.attackTimer=0;
      const atk=['fan3','omni16','burst','rampage'][Math.floor(Math.random()*4)];
      if (atk==='fan3') {
        const a=Math.atan2(player.y-this.y,player.x-this.x);
        for(let i=-1;i<=1;i++) fireEnemy(this.x,this.y,a+i*0.2,7,{color:'#ff4444',glow:'#ff2200'});
      } else if (atk==='omni16') {
        for(let i=0;i<16;i++) fireEnemy(this.x,this.y,i*Math.PI/8,4,{color:'#ff4444',glow:'#ff2200'});
      } else if (atk==='burst') {
        const a=Math.atan2(player.y-this.y,player.x-this.x);
        for(let i=0;i<12;i++) setTimeout(()=>{if(this.alive)fireEnemy(this.x,this.y,a+(Math.random()-0.5)*0.15,5,{color:'#ff4444',glow:'#ff2200'});},i*70);
      } else if (atk==='rampage') {
        this.rampageActive=true; this.rampageTimer=0; this.rampageStep=0;
      }
    },

    hit(d) {
      this.hp -= d; if (this.hp<=0){this.hp=0;this.alive=false;}
    },

    draw() {
      // ランページレーザー描画
      for (const l of this.rampageLasers) {
        ctx.save();
        if (l.timer<l.warningTime){
          const wp = l.timer/l.warningTime;
          ctx.globalAlpha=0.1+0.55*wp; ctx.strokeStyle='#ff9966'; ctx.lineWidth=1; ctx.setLineDash([]); ctx.shadowColor='#ff4400'; ctx.shadowBlur=8;
          ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x+Math.cos(l.angle)*l.length,l.y+Math.sin(l.angle)*l.length);ctx.stroke();
        } else {
          const prog=(l.timer-l.warningTime)/(l.activeTime-l.warningTime);
          ctx.globalAlpha=0.9*(1-prog*0.5); ctx.strokeStyle='#ff6600'; ctx.lineWidth=Math.max(1,12*(1-prog)); ctx.shadowColor='#ff4400'; ctx.shadowBlur=18; ctx.lineCap='round';
          ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x+Math.cos(l.angle)*l.length,l.y+Math.sin(l.angle)*l.length);ctx.stroke();
        }
        ctx.restore();
      }
      drawBossCircle(this, '#ff8800', 35);
      drawBossHpBar(this);
    }
  };
  return b;
}

// === BOSS 4: WALL CANNON ===
function createBoss4() {
  return { x: W/2, y: 100, hp: loopHP(800), maxHp: loopHP(800), alive: true, color: '#44f',
    phase: 1, wallBullets: [], lastFire: 0, vx: 2.2, vy: 1.6, dashVx: 0, dashVy: 0, dashTrail: [], charging: false, chargeTimer: 0,
    update() {
      if (this.hp <= this.maxHp/2 && this.phase === 1) this.phase = 2;
      const spd = this.hp <= this.maxHp/2 ? 1.9 : 1.0;
      if (this.phase === 1) {
        this.x += this.vx*spd; this.y += this.vy*spd;
        if (this.x <= 30 || this.x >= W-30) this.vx *= -1;
        if (this.y <= 30 || this.y >= H-30) this.vy *= -1;
        this.x = Math.max(30, Math.min(W-30, this.x));
        this.y = Math.max(30, Math.min(H-30, this.y));
      } else {
        if (!this.charging) {
          this.chargeTimer++;
          if (this.chargeTimer >= 80) {
            this.charging = true; this.chargeTimer = 0;
            const dx = player.x - this.x, dy = player.y - this.y, dist = Math.hypot(dx, dy) || 1;
            this.dashVx = dx/dist*8; this.dashVy = dy/dist*8;
          }
        } else {
          this.dashTrail.push({x: this.x, y: this.y, life: 10});
          this.x += this.dashVx; this.y += this.dashVy;
          if (this.x < 30 || this.x > W-30 || this.y < 30 || this.y > H-30) {
            this.x = Math.max(30, Math.min(W-30, this.x));
            this.y = Math.max(30, Math.min(H-30, this.y));
            this.charging = false; this.dashVx = 0; this.dashVy = 0;
          }
          this.chargeTimer++;
          if (this.chargeTimer > 30) { this.charging = false; this.chargeTimer = 0; }
          if (player.alive && !player.invincible && Math.hypot(player.x-this.x, player.y-this.y) < 30 && player.damageTimer === 0) hitPlayer(25);
        }
      }
      for (const t of this.dashTrail) t.life--;
      this.dashTrail = this.dashTrail.filter(t => t.life > 0);
      const now = Date.now();
      if (now - this.lastFire > 180) {
        this.lastFire = now;
        if (this.phase === 1) {
          const side = Math.random() < 0.5 ? 'left' : 'right';
          this.wallBullets.push({x: side==='left' ? 0 : W, y: Math.random()*H, vx: side==='left' ? 3 : -3, vy: 0, alive: true});
        } else {
          const side = Math.random() < 0.5 ? 'top' : 'bottom';
          this.wallBullets.push({x: Math.random()*W, y: side==='top' ? 0 : H, vx: 0, vy: side==='top' ? 3 : -3, alive: true});
        }
      }
      for (const b of this.wallBullets) {
        b.x += b.vx; b.y += b.vy;
        if (b.x < -10 || b.x > W+10 || b.y < -10 || b.y > H+10) b.alive = false;
        if (player.alive && !player.invincible && Math.hypot(player.x-b.x, player.y-b.y) < 16) { hitPlayer(15); b.alive = false; }
      }
      this.wallBullets = this.wallBullets.filter(b => b.alive);
    },
    hit(d) { this.hp -= d; if(this.hp<=0){this.hp=0;this.alive=false;this.wallBullets=[];} },
    draw() {
      // 突進残像
      for (const t of this.dashTrail) {
        ctx.save(); ctx.globalAlpha = (t.life/10)*0.45;
        ctx.fillStyle = '#88f'; ctx.shadowColor = '#44f'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(t.x, t.y, 30, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
      drawBossCircle(this, (this.hp <= this.maxHp/2 && Math.floor(frameCount/6)%2===0) ? '#88f' : '#44f', 35);
      for (const b of this.wallBullets) {
        ctx.save(); ctx.fillStyle = '#f22'; ctx.shadowColor = '#f00'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
      drawBossHpBar(this);
    }
  };
}

            });

      },

      draw() { drawBossCircle(this, '#ff0', 35); }
    },
    minions: [], signalBullets: [], teleTimer: Date.now(), alive: true,

      }
      if (this.boss.alive) this.boss.update(this.minions, this.signalBullets);
      while (this.minions.length < Math.min(5, 2+Math.floor((this.boss.maxHp-this.boss.hp)/(this.boss.maxHp/4)))) {
        this.minions.push({
          x: 100+Math.random()*(W-200), y: H/2+Math.random()*(H/2-50),
          hp: 99999999, maxHp: 99999999, alive: true, signals: 0, statusEffects: {},
          update() {
            while (this.signals > 0) {
              const p = ['3way','circle','multi','8wayLaser','reflect3','plasma'][Math.floor(Math.random()*6)];
              if (p === '3way') {
                for (let i=-1; i<=1; i++) fireEnemy(this.x, this.y, Math.atan2(player.y-this.y, player.x-this.x)+i*0.3, 5);
              } else if (p === 'circle') {
                for (let i=0; i<16; i++) fireEnemy(this.x, this.y, i*Math.PI/8, 3);
              } else if (p === 'multi') {
                for (let s of [3,4,5]) fireEnemy(this.x, this.y, Math.atan2(player.y-this.y, player.x-this.x), s);
              } else if (p === '8wayLaser') {
                for (let i=0; i<8; i++) {
                  const a = i*Math.PI/4;
                  enemyLasers.push({axis:'custom', angle:a, x:this.x, y:this.y, warningTimer:30, activeTimer:20});
                }
              } else if (p === 'reflect3') {
                const a = Math.atan2(player.y-this.y, player.x-this.x);
                for (let xi=0; xi<4; xi++) {
                  const xa = a + xi * Math.PI/2; // X字=45°刻みでなく90°刻み
                  enemyBullets.push({x: this.x, y: this.y, vx: Math.cos(xa)*7, vy: Math.sin(xa)*7, alive: true, type: 'enemyChakram', size: 12, color: '#ff6699', reflectCount: 0, maxReflect: 2, trail: []});
                }
              } else if (p === 'plasma') {
                plasmas.push({x: this.x, y: this.y, maxR: 160, timer: 0, isPlayer: false, lightningTimer: 0});
              }
              this.signals--;
            }
          },
          draw() {
            ctx.save(); ctx.fillStyle='#ff9'; ctx.shadowColor='#ff0'; ctx.shadowBlur=8;
            ctx.beginPath(); ctx.arc(this.x, this.y, 15, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            ctx.fillStyle='#333'; ctx.fillRect(this.x-15, this.y-28, 30, 4);
            ctx.fillStyle='#ff0'; ctx.fillRect(this.x-15, this.y-28, 30*(this.hp/this.maxHp), 4);
          }
        });
      }
      for (const m of this.minions) if (m.alive) m.update();
      for (const s of this.signalBullets) s.update(this.minions);
      this.signalBullets = this.signalBullets.filter(s => s.alive);
      if (!this.boss.alive) {
        for (const m of this.minions) m.alive = false;
        this.alive = false;
      }
    },
    hit(d, bx, by) {
      if (this.boss.alive && Math.hypot(this.boss.x-bx, this.boss.y-by) < 30) {
        applyDamageWithFragile(this.boss, d, bx, by);
      } else for (const m of this.minions) if (m.alive && Math.hypot(m.x-bx, m.y-by) < 15) {
        applyDamageWithFragile(m, d, bx, by);
        break;
      }
    },
    draw() {
      this.boss.draw();
      for (const m of this.minions) if (m.alive) m.draw();
      for (const s of this.signalBullets) s.draw();
      if (this.boss.alive) {
        ctx.fillStyle = '#333'; ctx.fillRect(W-120, 20, 100, 10);
        ctx.fillStyle = '#ff0'; ctx.fillRect(W-120, 20, 100*(this.boss.hp/this.boss.maxHp), 10);
      }
    }
  };
}

// === BOSS 9 ===
function createBoss9() {
  return { x: W/2, y: H/2, hp: loopHP(1000), maxHp: loopHP(1000), alive: true, color: '#fffdd0',
    angle: 0, rotDir: 1, rotAccum: 0, stickLen: 0, fireTimer: 0, pDamTimer: 0,
    update() {
      if (this.pDamTimer > 0) this.pDamTimer--;
      if (this.stickLen < W + H) this.stickLen += 8;
      else {
        const speed = this.hp <= this.maxHp / 2 ? 0.015 : 0.008;
        this.angle += speed * this.rotDir;
        this.rotAccum += speed;
        if (this.rotAccum >= Math.PI * 2 * 3) { this.rotDir *= -1; this.rotAccum = 0; }
        
        this.fireTimer++;
        const interval = this.hp <= this.maxHp / 2 ? 10 : 20;
        if (this.fireTimer >= interval) {
          this.fireTimer = 0; fireEnemy(this.x, this.y, Math.random()*Math.PI*2, 4);
        }
      }
      if (this.stickLen > 0 && this.pDamTimer === 0) {
        for (let i=0; i<4; i++) {
          const a = this.angle + i * Math.PI/2;
          const x2 = this.x + Math.cos(a) * this.stickLen, y2 = this.y + Math.sin(a) * this.stickLen;
          if (distToSegment(player.x, player.y, this.x, this.y, x2, y2) < 14) { hitPlayer(30); this.pDamTimer = 30; break; }
        }
        for (const b of playerBullets) { 
          if (!b.alive) continue; 
          for (let i=0; i<4; i++) {
            const a = this.angle + i * Math.PI/2;
            const x2 = this.x + Math.cos(a) * this.stickLen, y2 = this.y + Math.sin(a) * this.stickLen;
            if (distToSegment(b.x, b.y, this.x, this.y, x2, y2) < 10) { 
              b.alive = false; 
              break; 
            }
          }
        }
      }
    },
    hit(d) { this.hp -= d; if(this.hp<=0){this.hp=0;this.alive=false;} },
    draw() {
      if (this.stickLen > 0) {
        ctx.save(); ctx.strokeStyle = '#f00'; ctx.lineWidth = 6; ctx.shadowColor = '#f00'; ctx.shadowBlur = 10;
        for(let i=0; i<4; i++) {
          const a = this.angle + i*Math.PI/2;
          ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(a)*this.stickLen, this.y + Math.sin(a)*this.stickLen); ctx.stroke();
        }
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        for(let i=0; i<4; i++) {
          const a = this.angle + i*Math.PI/2;
          ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(a)*this.stickLen, this.y + Math.sin(a)*this.stickLen); ctx.stroke();
        }
        ctx.restore();
      }
      drawBossCircle(this, this.color, 35); drawBossHpBar(this);
    }
  };
}

      }
      else if (this.state === 'attack3') {
        // プラズマラッシュ：ランダム位置に12回
        if (this.stateTimer % 10 === 0 && this.attackCount < 12) {
          plasmas.push({x: Math.random()*W, y: Math.random()*H, maxR: 80, timer: 0, isPlayer: false, lightningTimer: 0});
          this.attackCount++;
        }
        this.stateTimer++; if (this.attackCount >= 12 && this.stateTimer > 180) this.endAttack();
      }
      else if (this.state === 'attack4') {
        // 32方向弾：4回連続
        if (this.stateTimer % 40 === 0 && this.attackCount < 4) {
          for (let i = 0; i < 32; i++) fireEnemy(this.x, this.y, i * Math.PI * 2 / 32, 4);
          this.attackCount++;
        }
        this.stateTimer++; if (this.attackCount >= 4 && this.stateTimer > 150) this.endAttack();
      }
      else if (this.state === 'attack5') {
        // 一斉レーザー
        if (this.stateTimer === 0) {
          for (let i = 0; i < 30; i++) {
            enemyLasers.push({axis: 'custom', angle: Math.random()*Math.PI*2, x: Math.random()*W, y: Math.random()*H, warningTimer: 50, activeTimer: 20});
          }
        }
        this.stateTimer++; if (this.stateTimer > 100) this.endAttack();
      }
      else if (this.state === 'attack6') {
        // スティックぶん回し（突進移動しながら）
        if (this.stateTimer === 0) { this.stickLen = 0; this.stickAngle = 0; this.pDamTimer = 0; }
        if (this.pDamTimer > 0) this.pDamTimer--;
        if (this.stateTimer < 30) this.stickLen = Math.min(H/3, this.stickLen + 8);
        else if (this.stateTimer < 180) this.stickAngle += Math.PI / 16;
        else if (this.stateTimer < 210) this.stickLen = Math.max(0, this.stickLen - 8);

        if (this.stickLen > 0 && this.pDamTimer === 0) {
          for (let i = 0; i < 4; i++) {
            const a = this.stickAngle + i * Math.PI / 2;
            const x2 = this.x + Math.cos(a) * this.stickLen, y2 = this.y + Math.sin(a) * this.stickLen;
            if (distToSegment(player.x, player.y, this.x, this.y, x2, y2) < 14) { hitPlayer(30); this.pDamTimer = 30; break; }
          }
          for (const b of playerBullets) {
            if (!b.alive) continue;
            for (let i = 0; i < 4; i++) {
              const a = this.stickAngle + i * Math.PI / 2;
              const x2 = this.x + Math.cos(a) * this.stickLen, y2 = this.y + Math.sin(a) * this.stickLen;
              if (distToSegment(b.x, b.y, this.x, this.y, x2, y2) < 10) { b.alive = false; break; }
            }
          }
        }
        this.stateTimer++; if (this.stateTimer > 210) { this.stickLen = 0; this.endAttack(); }
      }
    },
    endAttack() { this.state = 'idle'; this.stateTimer = 0; },
    hit(d) { this.hp -= d; if(this.hp<=0){this.hp=0;this.alive=false;this.dashTrail=[];} },
    draw() {
      // 残像の描画
      for (const t of this.dashTrail) {
        ctx.save(); ctx.globalAlpha = t.life/10*0.4; ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(t.x, t.y, 35, 0, Math.PI*2); ctx.fill(); ctx.restore();
      }
      // スティックの描画
      if (this.stickLen > 0) {
        ctx.save(); ctx.strokeStyle = '#f00'; ctx.lineWidth = 6; ctx.shadowColor = '#f00'; ctx.shadowBlur = 10;
        for (let i = 0; i < 4; i++) {
          const a = this.stickAngle + i * Math.PI / 2;
          ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(a)*this.stickLen, this.y + Math.sin(a)*this.stickLen); ctx.stroke();
        }
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          const a = this.stickAngle + i * Math.PI / 2;
          ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(a)*this.stickLen, this.y + Math.sin(a)*this.stickLen); ctx.stroke();
        }
        ctx.restore();
      }
      drawBossCircle(this, this.color, 35); drawBossHpBar(this);
    }
  };
}

// === BOSS 13: ECLIPSE ===
function createBoss13() {
  return {
    x: W / 2, y: H / 3, hp: loopHP(2400), maxHp: loopHP(2400), alive: true, color: '#000',
    state: 'idle', stateTimer: 0,
    attackCount: 0, maxAttacks: 2,
    bubbles: [], convergeBullets: [], convergeBaseAngle: 0,
    rotLasers: [], rotLaserStep: 0,  // 回転レーザー用
    rampageLasers: [], rampageLaserStep: 0,  // ランページレーザー用
    autoLaserTimer: 0,  // HP半分以下の自動ホーミングレーザー

    update() {
      this.stateTimer++;
      this.updateBubbles();
      this.updateConvergeBullets();
      this.updateRotLasers();
      this.updateRampageLasers();

      // HP半分以下で3秒(180f)ごとに自機へホーミングレーザーを発射（行動数にカウントしない）
      if (this.hp < this.maxHp * 0.6 && this.alive) {
        this.autoLaserTimer++;
        if (this.autoLaserTimer >= 180) {
          this.autoLaserTimer = 0;
          const a = Math.atan2(player.y - this.y, player.x - this.x);
          const len = Math.max(W, H) * 2;
          this.rotLasers.push({ x: this.x, y: this.y, angle: a, length: len, timer: 0, warningTime: 30, activeTime: 60, alive: true, isAuto: true });
        }
      }

      switch (this.state) {
        case 'idle':
          if (this.stateTimer > 40) {
            if (this.attackCount >= this.maxAttacks) {
              this.state = 'teleport_out';
              this.stateTimer = 0;
              this.attackCount = 0;
              this.maxAttacks = Math.random() < 0.5 ? 2 : 3;
            } else {
              this.chooseAttack();
            }
          }
          break;

        case 'teleport_out':
          if (this.stateTimer > 30) {
            this.x = 80 + Math.random() * (W - 160);
            this.y = 80 + Math.random() * (H / 2 - 80);
            this.state = 'teleport_in';
            this.stateTimer = 0;
          }
          break;

        case 'teleport_in':
          if (this.stateTimer > 30) { this.state = 'idle'; this.stateTimer = 0; }
          break;

        case 'attack_spread':
          if (this.stateTimer <= 180) {
            if (this.stateTimer % 4 === 0) {
              const a = Math.atan2(player.y - this.y, player.x - this.x);
              fireEnemy(this.x, this.y, a + (Math.random()-0.5)*0.5, 2 + Math.random()*6, { color: '#fff', glow: '#888' });
            }
          } else { this.endAttack(); }
          break;

        case 'attack_converge':
          if (this.stateTimer === 30 || this.stateTimer === 60 || this.stateTimer === 90) {
            const baseAngle = (this.stateTimer === 60) ? Math.random() * Math.PI : this.convergeBaseAngle;
            if (this.stateTimer === 30) this.convergeBaseAngle = baseAngle;
            const R = 600; 
            for (let i = 0; i < 32; i++) {
              const a = baseAngle + (i * Math.PI * 2 / 32);
              this.convergeBullets.push({
                x: this.x + Math.cos(a)*R, y: this.y + Math.sin(a)*R,
                vx: Math.cos(a + Math.PI)*7, vy: Math.sin(a + Math.PI)*7,
                speed: 7, color: '#fff', glow: '#555', alive: true
              });
            }
          }
          if (this.stateTimer > 200) this.endAttack();
          break;

        case 'attack_blackhole':
          if (this.stateTimer < 180) {
            const dx = this.x - player.x, dy = this.y - player.y, dist = Math.hypot(dx, dy);
            if (dist > 0 && !player.invincible) { player.x += (dx / dist) * 2.3; player.y += (dy / dist) * 2.3; }
            if (this.stateTimer % 1 === 0) {
              const a = Math.random() * Math.PI * 3;
              const R = 600;
              this.convergeBullets.push({
                x: this.x + Math.cos(a)*R, y: this.y + Math.sin(a)*R,
                vx: Math.cos(a + Math.PI)*9, vy: Math.sin(a + Math.PI)*9,
                speed: 10, color: '#fff', glow: '#fff', alive: true
              });
            }
          } else { this.state = 'attack_bubble'; this.stateTimer = 0; }
          break;

        case 'attack_bubble':
          if (this.stateTimer === 10) {
            const a = Math.atan2(player.y - this.y, player.x - this.x);
            // 残像・消滅演出付きのバブル
            this.bubbles.push({
              x: this.x, y: this.y,
              vx: Math.cos(a)*6, vy: Math.sin(a)*6,
              radius: 60, minRadius: 15, reflectRemaining: 4, alive: true,
              trail: [], burst: false, burstTimer: 0, burstParticles: []
            });
          }
          // バブルを放ったらすぐ次の行動へ（バブルが消えるのを待たない）
          if (this.stateTimer > 10) this.endAttack();
          break;

        case 'attack_rampage_laser':
          // ランダムな方向に白いレーザーを32回放つ
          if (this.stateTimer === 1) { this.rampageLaserStep = 0; }
          if (this.rampageLaserStep < 32 && this.stateTimer % 4 === 0) {
            const angle = Math.random() * Math.PI * 2;
            const len = Math.max(W, H) * 2;
            this.rampageLasers.push({ x: this.x, y: this.y, angle: angle, length: len, timer: 0, warningTime: 20, activeTime: 50, alive: true });
            this.rampageLaserStep++;
          }
          if (this.rampageLaserStep >= 32 && this.rampageLasers.length === 0) this.endAttack();
          break;

        case 'attack_rotation_laser':
          // 64回高速で少しずつ角度をずらしながら両方向にレーザーを放つ（1周）
          if (this.stateTimer === 1) { this.rotLaserStep = 0; }
          if (this.rotLaserStep < 32 && this.stateTimer % 6 === 0) {
            const angle = -Math.PI/2 + (this.rotLaserStep / 32) * Math.PI * 2;
            const len = Math.max(W, H) * 1.8;
            // 両方向（angle と angle+π）にレーザーを1本ずつ生成
            this.rotLasers.push({ x: this.x, y: this.y, angle: angle,          length: len, timer: 0, warningTime: 10, activeTime: 28, alive: true });
            this.rotLasers.push({ x: this.x, y: this.y, angle: angle + Math.PI, length: len, timer: 0, warningTime: 10, activeTime: 28, alive: true });
            this.rotLaserStep++;
          }
          if (this.rotLaserStep >= 32 && this.rotLasers.length === 0) this.endAttack();
          break;
      }
    },

    chooseAttack() {
      const attacks = ['attack_spread', 'attack_converge', 'attack_blackhole', 'attack_rotation_laser', 'attack_rampage_laser'];
      this.state = attacks[Math.floor(Math.random() * attacks.length)];
      this.stateTimer = 0;
    },

    endAttack() { this.state = 'idle'; this.stateTimer = 0; this.attackCount++; },

    updateBubbles() {
      for (const s of this.bubbles) {
        if (!s.alive) continue;

        // 残像を記録
        s.trail = s.trail || [];
        s.trail.unshift({ x: s.x, y: s.y, alpha: 0.25 });
        if (s.trail.length > 10) s.trail.pop();

        // バーストアニメーション
        if (s.burst) {
          s.burstTimer--;
          for (const p of s.burstParticles) {
            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed;
            p.alpha *= 0.88;
          }
          if (s.burstTimer <= 0) s.alive = false;
          continue;
        }

        s.x += s.vx; s.y += s.vy;
        let ref = false, wall = false;
        if (s.x - s.radius < 0) { wall = true; if (s.reflectRemaining > 0) { s.x = s.radius; s.vx = Math.abs(s.vx); ref = true; } }
        if (s.x + s.radius > W) { wall = true; if (s.reflectRemaining > 0) { s.x = W - s.radius; s.vx = -Math.abs(s.vx); ref = true; } }
        if (s.y - s.radius < 0) { wall = true; if (s.reflectRemaining > 0) { s.y = s.radius; s.vy = Math.abs(s.vy); ref = true; } }
        if (s.y + s.radius > H) { wall = true; if (s.reflectRemaining > 0) { s.y = H - s.radius; s.vy = -Math.abs(s.vy); ref = true; } }
        if (ref) {
          const nr = Math.max(s.minRadius, s.radius * 0.7), sp = Math.hypot(s.vx, s.vy), ang = Math.atan2(s.vy, s.vx) + Math.PI/3;
          this.bubbles.push({ x: s.x, y: s.y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, radius: nr, minRadius: s.minRadius, reflectRemaining: s.reflectRemaining-1, alive: true, trail: [], burst: false, burstTimer: 0, burstParticles: [] });
          s.radius = nr; s.reflectRemaining--;
        }
        if (wall && !ref && !s.burst) {
          // 消える演出（バースト）
          s.burst = true;
          s.burstTimer = 14;
          s.burstParticles = [];
          for (let i = 0; i < 12; i++) {
            s.burstParticles.push({ x: 0, y: 0, angle: (Math.PI*2/12)*i, speed: 2 + Math.random()*3, alpha: 1 });
          }
          s.vx = 0; s.vy = 0;
        }
        if (player.alive && !player.invincible && Math.hypot(player.x - s.x, player.y - s.y) < s.radius + 16) hitPlayerDamage(1, 30);
      }
      this.bubbles = this.bubbles.filter(s => s.alive);
    },

    updateConvergeBullets() {
      for (const b of this.convergeBullets) {
        if (!b.alive) continue;
        b.x += b.vx; b.y += b.vy;
        if (Math.hypot(b.x - this.x, b.y - this.y) < b.speed + 5) b.alive = false;
        if (player.alive && !player.invincible && Math.hypot(player.x - b.x, player.y - b.y) < 10) hitPlayerDamage(1, 30);
      }
      this.convergeBullets = this.convergeBullets.filter(b => b.alive);
    },

    updateRotLasers() {
      for (const l of this.rotLasers) {
        l.timer++;
        if (l.timer >= l.warningTime && l.timer < l.activeTime) {
          if (player.alive && !player.invincible) {
            const vx = Math.cos(l.angle), vy = Math.sin(l.angle);
            const dx = player.x - l.x, dy = player.y - l.y;
            const t = dx*vx + dy*vy;
            if (t > 0 && t < l.length) {
              const dist = Math.hypot(player.x - (l.x + t*vx), player.y - (l.y + t*vy));
              if (dist < 10) hitPlayerDamage(2, 20);
            }
          }
        }
        if (l.timer >= l.activeTime) l.alive = false;
      }
      this.rotLasers = this.rotLasers.filter(l => l.alive);
    },

    updateRampageLasers() {
      for (const l of this.rampageLasers) {
        l.timer++;
        if (l.timer >= l.warningTime && l.timer < l.activeTime) {
          if (player.alive && !player.invincible) {
            const vx = Math.cos(l.angle), vy = Math.sin(l.angle);
            const dx = player.x - l.x, dy = player.y - l.y;
            const t = dx*vx + dy*vy;
            if (t > 0 && t < l.length) {
              const dist = Math.hypot(player.x - (l.x + t*vx), player.y - (l.y + t*vy));
              if (dist < 10) hitPlayerDamage(2, 20);
            }
          }
        }
        if (l.timer >= l.activeTime) l.alive = false;
      }
      this.rampageLasers = this.rampageLasers.filter(l => l.alive);
    },

    hit(d) {
      if (this.state === 'teleport_out' || this.state === 'teleport_in') return;
      this.hp -= d; if (this.hp <= 0) { this.hp = 0; this.alive = false; }
    },

    draw() {
      for (const b of this.convergeBullets) {
        ctx.save(); ctx.fillStyle = b.color; ctx.shadowColor = b.glow; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      // バブル描画（残像・バースト演出付き）
      for (const s of this.bubbles) {
        ctx.save();
        if (s.burst) {
          // バースト（消滅）演出
          for (const p of s.burstParticles || []) {
            ctx.globalAlpha = p.alpha * 0.8;
            ctx.fillStyle = 'rgba(220, 220, 255, 0.9)';
            ctx.beginPath(); ctx.arc(s.x + p.x, s.y + p.y, Math.max(2, s.radius * 0.15), 0, Math.PI*2); ctx.fill();
          }
          ctx.restore();
          continue;
        }
        // 残像
        for (const t of s.trail || []) {
          ctx.globalAlpha = t.alpha;
          ctx.fillStyle = 'rgba(200, 200, 255, 0.3)';
          ctx.strokeStyle = 'rgba(220, 220, 255, 0.2)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(t.x, t.y, s.radius * 0.85, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }
        // 本体
        ctx.globalAlpha = 1;
        const alpha = 0.35 + 0.2 * Math.sin(frameCount * 0.15);
        ctx.fillStyle = `rgba(200, 200, 255, ${alpha})`; ctx.strokeStyle = 'rgba(220, 220, 255, 0.9)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      // ランページレーザー描画（白色・ボス起点）
      for (const l of this.rampageLasers) {
        ctx.save();
        if (l.timer < l.warningTime) {
          // 予告：細い白輝線
          ctx.globalAlpha = 0.1 + 0.55 * (l.timer / l.warningTime);
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
          ctx.setLineDash([]);
          ctx.shadowColor = '#aaaaff'; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.moveTo(l.x, l.y);
          ctx.lineTo(l.x + Math.cos(l.angle)*l.length, l.y + Math.sin(l.angle)*l.length); ctx.stroke();
          ctx.setLineDash([]);
        } else {
          const progress = (l.timer - l.warningTime) / (l.activeTime - l.warningTime);
          ctx.globalAlpha = 0.92 * (1 - progress * 0.5);
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, 14 * (1 - progress));
          ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 24; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(l.x, l.y);
          ctx.lineTo(l.x + Math.cos(l.angle)*l.length, l.y + Math.sin(l.angle)*l.length); ctx.stroke();
        }
        ctx.restore();
      }
      // 自動ホーミングレーザー（rotLasersのisAuto）は通常の回転レーザー描画で表示

      // 回転レーザー描画（白色・太め・両方向）
      for (const l of this.rotLasers) {
        ctx.save();
        if (l.isAuto) {
          // 自動ホーミングレーザー：予告輝線 → 本体太線
          if (l.timer < l.warningTime) {
            const warnP = l.timer / l.warningTime;
            ctx.globalAlpha = 0.1 + 0.55 * warnP;
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
            ctx.setLineDash([]); ctx.lineCap = 'round';
            ctx.shadowColor = '#aaaaff'; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x + Math.cos(l.angle)*l.length, l.y + Math.sin(l.angle)*l.length);
            ctx.stroke(); ctx.setLineDash([]);
          } else {
            const progress = (l.timer - l.warningTime) / (l.activeTime - l.warningTime);
            ctx.globalAlpha = 0.95 * (1 - progress * 0.5);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, 18 * (1 - progress));
            ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 28; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x + Math.cos(l.angle)*l.length, l.y + Math.sin(l.angle)*l.length);
            ctx.stroke();
          }
        } else {
          // 回転レーザー：予告輝線 → 本体太線
          if (l.timer < l.warningTime) {
            const warnP = l.timer / l.warningTime;
            ctx.globalAlpha = 0.1 + 0.55 * warnP;
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
            ctx.setLineDash([]); ctx.lineCap = 'round';
            ctx.shadowColor = '#aaaaff'; ctx.shadowBlur = 6;
            ctx.beginPath(); ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x + Math.cos(l.angle)*l.length, l.y + Math.sin(l.angle)*l.length);
            ctx.stroke(); ctx.setLineDash([]);
          } else {
            const progress = (l.timer - l.warningTime) / (l.activeTime - l.warningTime);
            const w = Math.max(2, 22 * (1 - progress));
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = w;
            ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 30;
            ctx.globalAlpha = 0.9 * (1 - progress * 0.4); ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x + Math.cos(l.angle)*l.length, l.y + Math.sin(l.angle)*l.length);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
      if (this.state === 'attack_blackhole') {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(frameCount * 0.1);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.4;
        for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(0, 0, 40 + Math.random() * 80, 0, Math.PI * 2); ctx.stroke(); }
        ctx.restore();
      }
      ctx.save();
      let sc = 1, op = 1;
      if (this.state === 'teleport_out') sc = op = 1 - (this.stateTimer / 30);
      else if (this.state === 'teleport_in') sc = op = this.stateTimer / 30;
      if (sc > 0) {
        ctx.translate(this.x, this.y); ctx.scale(sc, sc); ctx.globalAlpha = op;
        ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 30 * ((this.state === 'attack_flash') ? 2 : 1);
        ctx.beginPath(); ctx.arc(0, 0, 32 + Math.sin(frameCount * 0.1) * 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = this.color; ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      if (this.hp > 0 && op > 0) {
        const oc = this.color; this.color = 'rgba(240, 240, 240, 0.9)';
        if (typeof drawBossHpBar === 'function') drawBossHpBar(this);
        this.color = oc;
      }
    }
  };
}


// === BOSS 14: DREAM STORM ===
function createBoss14() {
  return {
    x: W/2, y: H/3, hp: loopHP(2500), maxHp: loopHP(2500), alive: true, color: '#cc88ff',
    rotation: 0,
    state: 'idle', stateTimer: 0,
    attackCount: 0, maxAttacks: 3,
    // 攻撃用配列
    bossTornadoes: [], bossMeteors: [], bossLasers: [],
    // 連続レーザーカウンタ
    seqLaserStep: 0, seqLaserTimer: 0,
    // 扇拡大レーザー
    fanStep: 0, fanBaseAngle: 0, fanTimer: 0,
    // 子分展開
    minionPhaseTriggered: false, minionBarrier: false, minions: [],

    update() {
      this.stateTimer++;
      this.rotation += 0.018;
      this.updateBossTornadoes();
      this.updateBossMeteors();
      this.updateBossLasers();
      this.updateMinions();

      // 子分展開トリガー（HP40%以下、1回限り）
      if (!this.minionPhaseTriggered && this.hp <= this.maxHp * 0.4) {
        this.minionPhaseTriggered = true;
        this.minionBarrier = true;
        this.state = 'minion_phase'; this.stateTimer = 0;
        this.spawnMinions();
      }

      switch (this.state) {
        case 'idle':
          if (this.stateTimer > 15) {
            if (this.attackCount >= this.maxAttacks) {
              this.state='teleport_out'; this.stateTimer=0; this.attackCount=0;
              this.maxAttacks = Math.random()<0.5?2:3;
            } else { this.chooseAttack(); }
          }
          break;
        case 'teleport_out':
          if (this.stateTimer>25){this.x=80+Math.random()*(W-160);this.y=80+Math.random()*(H/2-80);this.state='teleport_in';this.stateTimer=0;}
          break;
        case 'teleport_in':
          if (this.stateTimer>25){this.state='idle';this.stateTimer=0;}
          break;
        case 'attack_tornado':
          // ★修正：トルネードの発射間隔を広げ（10, 30, 50フレーム目）
          if ([10,30,50].includes(this.stateTimer)) {
            const colors=['#ff88bb','#88ccff','#cc88ff'];
            const ci=[10,30,50].indexOf(this.stateTimer);
            this.fireBossTornado(colors[ci]);
          }
          // ★修正：3つ目を出したら、画面に残っていても即座に次の行動へ
          if (this.stateTimer > 55) this.endAttack();
          break;
        case 'attack_meteor':
          if (this.stateTimer===1) this.meteorStep=0;
          if (this.meteorStep<6 && this.stateTimer%18===0) {
            const colors=['#ff88bb','#88ccff','#cc88ff','#ff88bb','#88ccff','#cc88ff'];
            this.fireBossMeteor(colors[this.meteorStep], this.meteorStep);
            this.meteorStep++;
          }
          if (this.meteorStep>=6&&this.bossMeteors.length===0) this.endAttack();
          break;
        case 'attack_laser32':
          if (this.stateTimer===1) {
            for(let i=0;i<32;i++){
              const a=(Math.PI*2/32)*i;
              // ★修正：予告線を少し長く（warningTime: 35, activeTime: 50）
              this.bossLasers.push({x:this.x,y:this.y,angle:a,length:Math.max(W,H)*2,timer:0,warningTime:55,activeTime:70,alive:true,color:'#cc88ff',dmg:2});
            }
          }
          if (this.stateTimer>80&&this.bossLasers.length===0) this.endAttack();
          break;
        case 'attack_seq_laser':
          if (this.stateTimer===1){this.seqLaserStep=0;}
          if (this.seqLaserStep<8 && this.stateTimer%15===0) {
            const a=Math.atan2(player.y-this.y,player.x-this.x);
            // ★修正：予告線を少し長く（warningTime: 25, activeTime: 40）
            this.bossLasers.push({x:this.x,y:this.y,angle:a,length:Math.max(W,H)*2,timer:0,warningTime:45,activeTime:60,alive:true,color:'#88ccff',dmg:2});
            this.seqLaserStep++;
          }
          if (this.seqLaserStep>=8&&this.bossLasers.length===0) this.endAttack();
          break;
        case 'attack_fan_laser':
          if (this.stateTimer===1){this.fanStep=0;this.fanBaseAngle=Math.atan2(player.y-this.y,player.x-this.x);}
          if (this.fanStep<7 && this.stateTimer%15===0) {
            const spread=this.fanStep*0.22;
            if (this.fanStep===0) {
              // ★修正：1本目の予告線を長く（warningTime: 24, activeTime: 40）
              this.bossLasers.push({x:this.x,y:this.y,angle:this.fanBaseAngle,length:Math.max(W,H)*2,timer:0,warningTime:45,activeTime:60,alive:true,color:'#ff88bb',dmg:2});
            } else {
              this.bossLasers.push({x:this.x,y:this.y,angle:this.fanBaseAngle-spread,length:Math.max(W,H)*2,timer:0,warningTime:55,activeTime:70,alive:true,color:'#ff88bb',dmg:2});
              this.bossLasers.push({x:this.x,y:this.y,angle:this.fanBaseAngle+spread,length:Math.max(W,H)*2,timer:0,warningTime:55,activeTime:70,alive:true,color:'#ff88bb',dmg:2});
            }
            this.fanStep++;
          }
          if (this.fanStep>=7&&this.bossLasers.length===0) this.endAttack();
          break;
        case 'minion_phase':
          // 全ミニオン撃破でバリア解除
          if (this.minions.every(m=>!m.alive)) {
            this.minionBarrier=false; this.state='idle'; this.stateTimer=0;
          }
          break;
      }
    },

    chooseAttack() {
      const atks=['attack_tornado','attack_meteor','attack_laser32','attack_seq_laser','attack_fan_laser'];
      this.state=atks[Math.floor(Math.random()*atks.length)]; this.stateTimer=0;
    },
    endAttack(){this.state='idle';this.stateTimer=0;this.attackCount++;},

    fireBossTornado(color) {
      const angle=Math.random()*Math.PI*2;
      this.bossTornadoes.push({
        x:this.x,y:this.y,originX:this.x,originY:this.y,
        baseAngle:angle,t:0,
        size:22,
        speed:0.55,color,
        trail:[],alive:true,hitSet:new Set()
      });
    },
    fireBossMeteor(color, idx) {
      const side=idx%4;
      let sx,sy;
      if(side===0){sx=Math.random()*W;sy=-50;}
      else if(side===1){sx=W+50;sy=Math.random()*H;}
      else if(side===2){sx=Math.random()*W;sy=H+50;}
      else{sx=-50;sy=Math.random()*H;}
      const dx=player.x-sx,dy=player.y-sy,len=Math.hypot(dx,dy)||1;
      this.bossMeteors.push({x:sx,y:sy,vx:(dx/len)*6,vy:(dy/len)*6,angle:Math.atan2(dy,dx),size:44,color,trail:[],alive:true,hitSet:new Set()});
    },

    updateBossTornadoes() {
      for(const t of this.bossTornadoes){
        if(!t.alive)continue;
        t.t++;
        const r=t.speed*t.t*1.6,angle=t.baseAngle+t.t*0.06;
        t.x=t.originX+Math.cos(angle)*r;t.y=t.originY+Math.sin(angle)*r;
        t.trail.unshift({x:t.x,y:t.y,alpha:0.32});if(t.trail.length>7)t.trail.pop();
        if(r>Math.max(W,H)*0.75||t.t>500){t.alive=false;continue;}
        if(player.alive&&!player.invincible&&!t.hitSet.has('player')&&Math.hypot(player.x-t.x,player.y-t.y)<t.size+14){
          hitPlayerDamage(1,30); t.hitSet.add('player'); setTimeout(()=>t.hitSet.delete('player'),500);
        }
      }
      this.bossTornadoes=this.bossTornadoes.filter(t=>t.alive);
    },
    updateBossMeteors() {
      for(const m of this.bossMeteors){
        if(!m.alive)continue;
        m.x+=m.vx;m.y+=m.vy;
        m.trail.unshift({x:m.x,y:m.y,alpha:0.38});if(m.trail.length>9)m.trail.pop();
        if(!m.hitSet)m.hitSet=new Set();
        if(player.alive&&!player.invincible&&!m.hitSet.has('player')&&Math.hypot(player.x-m.x,player.y-m.y)<m.size+16){
          hitPlayerDamage(1,30); m.hitSet.add('player'); setTimeout(()=>m.hitSet.delete('player'),400);
        }
        if(m.x<-120||m.x>W+120||m.y<-120||m.y>H+120)m.alive=false;
      }
      this.bossMeteors=this.bossMeteors.filter(m=>m.alive);
    },
    updateBossLasers() {
      for(const l of this.bossLasers){
        l.timer++;
        if(l.timer>=l.warningTime&&l.timer<l.activeTime){
          if(player.alive&&!player.invincible){
            const vx=Math.cos(l.angle),vy=Math.sin(l.angle);
            const dx=player.x-l.x,dy=player.y-l.y,t2=dx*vx+dy*vy;
            if(t2>0&&t2<l.length&&Math.hypot(player.x-(l.x+t2*vx),player.y-(l.y+t2*vy))<12) hitPlayerDamage(l.dmg,30);
          }
        }
        if(l.timer>=l.activeTime)l.alive=false;
      }
      this.bossLasers=this.bossLasers.filter(l=>l.alive);
    },

    spawnMinions() {
      const colors=['#ff88bb','#88ccff','#cc88ff'];
      const types=['pink','cyan','purple'];
      for(let i=0;i<3;i++){
        this.minions.push({
          type:types[i],color:colors[i],
          x:100+Math.random()*(W-200),y:80+Math.random()*(H/2),
          hp:100,maxHp:100,alive:true,
          fireTimer:0,moveTimer:0,
          tx:100+Math.random()*(W-200),ty:80+Math.random()*(H/2),
          state:'move',stateTimer:0,
          plasmaFired:false,dashTrail:[],
          laser:null,
          statusEffects:{},
          update:function(){
            this.stateTimer++;
            if(this.type==='pink'){
              // 2秒ごとに自機へレーザー
              this.fireTimer++;
              if(this.fireTimer>=120){
                this.fireTimer=0;
                if(player.alive){
                  const a=Math.atan2(player.y-this.y,player.x-this.x);
                  const llen=Math.max(W,H)*2;
                  this.laser={x:this.x,y:this.y,angle:a,length:llen,timer:0,warningTime:30,activeTime:56,alive:true,color:'#ff88bb',dmg:2};
                }
              }
              if(this.laser){
                this.laser.timer++;
                if(this.laser.timer>=this.laser.warningTime&&this.laser.timer<this.laser.activeTime){
                  if(player.alive&&!player.invincible){
                    const vx=Math.cos(this.laser.angle),vy=Math.sin(this.laser.angle);
                    const dx=player.x-this.x,dy=player.y-this.y,t2=dx*vx+dy*vy;
                    if(t2>0&&t2<this.laser.length&&Math.hypot(player.x-(this.x+t2*vx),player.y-(this.y+t2*vy))<12) hitPlayerDamage(2,20);
                  }
                }
                if(this.laser.timer>=this.laser.activeTime)this.laser=null;
              }
            } else if(this.type==='cyan'){
              // 挙持不審移動
              if(this.state==='move'){
                this.x+=(this.tx-this.x)*0.04;this.y+=(this.ty-this.y)*0.04;
                if(this.stateTimer>40){this.state=Math.random()<0.4?'stop':'dash';this.stateTimer=0;}
              } else if(this.state==='stop'){
                if(this.stateTimer>20){this.tx=80+Math.random()*(W-160);this.ty=60+Math.random()*(H/2-60);this.state='move';this.stateTimer=0;}
